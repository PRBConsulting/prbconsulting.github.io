<style>:root{--acc:#2e9e6b;--acc-ink:#fff;--brand2:#173528}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:6px 0 16px}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--acc);transform:translateY(-1px)}
.tile .ic{flex:0 0 44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.tile b{display:block;font-size:15px;margin-bottom:2px}.tile span{color:var(--mut);font-size:13px;line-height:1.35}
.tile .bd{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--acc);color:#fff}
.tile .bd.w{background:var(--warn)}.tile .bd.b{background:var(--bad)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--acc);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:6px}
.paso{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.paso i{flex:0 0 24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:grid;place-items:center}
details.mas{margin-top:12px}details.mas summary{cursor:pointer;color:var(--acc);font-weight:600}
</style>
<script src="../assets/i18n.js?v=5"></script>
